name: Windows-EXE erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      - name: Regressionstests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_party_picker test_manager test_visuals test_responsiveness

      - name: PartyPicker.exe bauen
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name PartyPicker
          --icon PartyPicker.ico
          --add-data "PartyPicker.ico;."
          --add-data "PartyPicker-icon.png;."
          --add-data "checkmark.png;."
          --add-data "VERSION;."
          --collect-all soundfile
          party_picker.py

      - name: Veröffentlichungspaket erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/PartyPicker.exe release/PartyPicker.exe
          Copy-Item README.txt release/README.txt
          Copy-Item README_EN.txt release/README_EN.txt
          Copy-Item LICENSE.txt release/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.txt release/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path release/* -DestinationPath PartyPicker-Windows.zip -Force

      - name: Build zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PartyPicker-Windows
          path: PartyPicker-Windows.zip
          if-no-files-found: error

      - name: Versionsnummer lesen
        id: version
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content VERSION -Raw).Trim()
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PartyPicker ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: PartyPicker-Windows.zip
