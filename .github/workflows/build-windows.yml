name: Windows-EXE erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - "playlist-manager-2-beta"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      - name: Regressionstests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_party_picker test_manager

      - name: PartyPicker.exe bauen
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name PartyPicker
          --icon PartyPicker.ico
          --add-data "PartyPicker.ico;."
          --add-data "PartyPicker-icon.png;."
          --add-data "checkmark.png;."
          --add-data "VERSION;."
          --collect-all soundfile
          party_picker.py

      - name: Veröffentlichungspaket erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/PartyPicker.exe release/PartyPicker.exe
          Copy-Item README.txt release/README.txt
          Copy-Item README_EN.txt release/README_EN.txt
          Copy-Item LICENSE.txt release/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.txt release/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path release/* -DestinationPath PartyPicker-Windows.zip -Force

      - name: Build zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PartyPicker-Windows
          path: PartyPicker-Windows.zip
          if-no-files-found: error

      - name: Bestehendes Release-Paket aktualisieren
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$(Get-Content VERSION)" PartyPicker-Windows.zip --clobber

      - name: GitHub-Release erstellen
        if: github.ref == 'refs/heads/playlist-manager-2-beta' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-beta.7
          target_commitish: ${{ github.sha }}
          name: PartyPicker 2.0 Beta
          prerelease: true
          body: |
            PartyPicker 2.0 Beta: Playlist-Manager mit fortlaufenden Spalten und gemeinsamem Scrollbalken.
            Titel an den Anfang oder ans Ende setzen, per Drag-and-drop verschieben und per Leertaste vorhören.
            Playlist-Manager-Button unten rechts im linken PartyPicker-Bereich.
            Navigation zum Listenanfang und Listenende per Button.
            Undo im Manager per Button und Strg+Z. Ziehvorschau: drei Titel und +Restanzahl.
            Grüne Einfügelinie und automatisches Scrollen: alle drei Sekunden zwanzig Prozent schneller.
            BPM wird angezeigt, wenn es in den Musikdatei-Tags vorhanden ist.
            Die Beta bitte zunächst mit einer Kopie der Playlist ausprobieren.
          files: PartyPicker-Windows.zip
