name: Windows-EXE erstellen

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      - name: Regressionstests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v test_party_picker

      - name: PartyPicker.exe bauen
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name PartyPicker
          --icon PartyPicker.ico
          --add-data "PartyPicker.ico;."
          --add-data "PartyPicker-icon.png;."
          --add-data "checkmark.png;."
          --add-data "VERSION;."
          --collect-all soundfile
          party_picker.py

      - name: Veröffentlichungspaket erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/PartyPicker.exe release/PartyPicker.exe
          Copy-Item README.txt release/README.txt
          Copy-Item README_EN.txt release/README_EN.txt
          Copy-Item LICENSE.txt release/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.txt release/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path release/* -DestinationPath PartyPicker-Windows.zip -Force

      - name: Build zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PartyPicker-Windows
          path: PartyPicker-Windows.zip
          if-no-files-found: error

      - name: Bestehendes Release-Paket aktualisieren
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$(Get-Content VERSION)" PartyPicker-Windows.zip --clobber

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PartyPicker ${{ github.ref_name }}
          body: |
            PartyPicker 1.2.0 – Mehr Übersicht und schneller vorhören

            - Gehörte Titel grau, aufgenommene grün und manuell übersprungene orange; Markierungen bleiben gespeichert.
            - Duplikat-Nachfrage anhand von Interpret und Titel, auch bei unterschiedlichen Dateien.
            - Einstellbare Startposition fürs Vorhören und optionale Lautstärkeangleichung.
            - Rückgängig per Button oder Strg+Z, mit automatischem Speichern.
            - Hintergrundprüfung vor der Wiedergabe, Erneut versuchen und Titel überspringen bei Fehlern.
            - Fortsetzen mit letztem Musikordner und zuletzt gespieltem Titel bleibt erhalten.

            Nach dem Download `PartyPicker-Windows.zip` vollständig entpacken und
            `PartyPicker.exe` starten. Beim ersten Start kann Windows SmartScreen
            wegen der fehlenden digitalen Signatur warnen.
          files: PartyPicker-Windows.zip
